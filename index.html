<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * {
    box-sizing: border-box;
  }
  
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: #f5f7f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  /* Wadah utama kartu profil */
  .wa-profile-card {
    background-color: #ffffff;
    width: 90%; 
    max-width: 320px; 
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    padding: 30px 20px;
    text-align: center;
    transition: transform 0.3s ease;
  }

  .wa-profile-card:hover {
    transform: translateY(-5px);
  }

  /* Gaya untuk foto profil */
  .wa-profile-pic-container {
    width: 100px;
    height: 100px;
    margin: 0 auto 16px auto;
    border-radius: 50%; /* Menjamin bingkai berbentuk lingkaran penuh */
    padding: 4px;
    background: linear-gradient(135deg, #e0e0e0, #ffffff);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .wa-profile-pic {
    width: 100%;
    height: 100%;
    border-radius: 50%; /* Membuat gambarnya ikut melingkar */
    object-fit: cover; /* Mantra rahasianya: ini mencegah gambar gepeng, otomatis memotong pas ke dalam lingkaran */
    border: 2px solid #ffffff;
  }

  /* Gaya untuk Nama */
  .wa-profile-name {
    font-size: 20px;
    font-weight: 700;
    color: #111b21;
    margin: 0 0 12px 0;
  }

  /* Gaya untuk Container Badge Game */
  .badges-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  /* Gaya untuk setiap Badge */
  .game-badge {
    display: inline-flex;
    align-items: center;
    background-color: #f0f2f5;
    color: #4b4f56;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid #e4e6eb;
  }

  .game-badge svg {
    width: 14px;
    height: 14px;
    margin-right: 6px;
    fill: currentColor;
  }

  /* Gaya Container Status */
  .wa-status-container {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 24px;
  }

  .status-dnd {
    color: #e53935;
  }

  .wa-status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: #e53935;
    margin-right: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .wa-status-dot::after {
    content: "";
    width: 6px;
    height: 2px;
    background-color: white;
    border-radius: 2px;
  }

  /* Gaya Tombol Kirim Pesan */
  .wa-send-btn {
    display: block;
    width: 100%;
    background-color: #25D366; 
    color: #ffffff;
    text-decoration: none;
    padding: 12px 0;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    transition: all 0.2s ease;
    outline: none;
  }

  .wa-send-btn:hover {
    background-color: #20bd5a;
  }

  .wa-send-btn:focus-visible {
    box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.4);
    transform: scale(1.02);
  }

  .wa-send-btn:active {
    transform: scale(0.97);
  }

  /* Gaya Link Sosial Media */
  .social-links-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #eaeaea; 
  }

  .social-btn {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 44px;
    height: 44px;
    background-color: #f0f2f5; 
    color: #4b4f56;
    border-radius: 50%;
    text-decoration: none;
    transition: all 0.3s ease;
    outline: none;
  }

  .social-btn svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  .social-btn.youtube:hover,
  .social-btn.youtube:focus-visible {
    background-color: #FF0000;
    color: #ffffff;
    transform: translateY(-4px);
    box-shadow: 0 4px 10px rgba(255, 0, 0, 0.3);
  }
  
  .social-btn.discord:hover,
  .social-btn.discord:focus-visible {
    background-color: #5865F2;
    color: #ffffff;
    transform: translateY(-4px);
    box-shadow: 0 4px 10px rgba(88, 101, 242, 0.3);
  }
  
  .social-btn.tiktok:hover,
  .social-btn.tiktok:focus-visible {
    background-color: #000000;
    color: #ffffff;
    transform: translateY(-4px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  }

  .social-btn.curseforge:hover,
  .social-btn.curseforge:focus-visible {
    background-color: #F16436;
    color: #ffffff;
    transform: translateY(-4px);
    box-shadow: 0 4px 10px rgba(241, 100, 54, 0.3);
  }

  .social-btn:focus-visible {
    box-shadow: 0 0 0 3px #111b21;
    transform: scale(1.1);
  }
</style>
